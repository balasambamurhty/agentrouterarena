name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate scenarios against schema + consistency
        run: python -c "from evaluator.scenario import load_scenarios; s=load_scenarios('benchmark/scenarios'); print(f'OK: {len(s)} scenarios valid')"
      - name: Run example router against the benchmark
        run: python evaluator/evaluate.py --router evaluator/example_router.py --scenarios benchmark/scenarios --out /tmp/results.json
